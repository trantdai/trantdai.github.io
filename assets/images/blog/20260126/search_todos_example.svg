<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Background -->
  <rect width="800" height="400" fill="#F5F5F5"/>

  <!-- Terminal/Console Window -->
  <rect x="50" y="50" width="700" height="300" fill="#1E1E1E" stroke="#333" stroke-width="2" rx="5"/>

  <!-- Window Header -->
  <rect x="50" y="50" width="700" height="30" fill="#2D2D2D" rx="5"/>
  <circle cx="70" cy="65" r="6" fill="#FF5F56"/>
  <circle cx="90" cy="65" r="6" fill="#FFBD2E"/>
  <circle cx="110" cy="65" r="6" fill="#27C93F"/>
  <text x="400" y="72" font-size="12" text-anchor="middle" fill="#AAA">Claude Desktop - Search Todos</text>

  <!-- Console Content -->
  <text x="70" y="110" font-size="13" fill="#4EC9B0" font-family="monospace">User:</text>
  <text x="70" y="130" font-size="12" fill="#D4D4D4" font-family="monospace">Find all todos related to documentation</text>

  <text x="70" y="165" font-size="13" fill="#DCDCAA" font-family="monospace">Claude:</text>
  <text x="70" y="185" font-size="12" fill="#D4D4D4" font-family="monospace">I'll search for todos containing "documentation".</text>

  <text x="70" y="215" font-size="12" fill="#4FC1FF" font-family="monospace">[Using tool: search_todos]</text>

  <!-- Results Box -->
  <rect x="70" y="230" width="660" height="100" fill="#252526" stroke="#3E3E42" stroke-width="1" rx="3"/>
  <text x="85" y="250" font-size="11" fill="#CE9178" font-family="monospace">Search Results for "documentation":</text>
  <text x="85" y="270" font-size="11" fill="#D4D4D4" font-family="monospace">1. Review MCP documentation [high priority, pending]</text>
  <text x="85" y="285" font-size="11" fill="#D4D4D4" font-family="monospace">2. Update API documentation [medium priority, in-progress]</text>
  <text x="85" y="300" font-size="11" fill="#D4D4D4" font-family="monospace">3. Write user documentation [low priority, pending]</text>
  <text x="85" y="315" font-size="11" fill="#6A9955" font-family="monospace">Found 3 matching todos</text>

  <!-- Note -->
  <text x="400" y="370" font-size="11" text-anchor="middle" fill="#888" font-style="italic">Example: Searching todos by keyword</text>
</svg>
