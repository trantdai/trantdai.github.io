<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#F5F5F5"/>

  <!-- Claude Desktop Window -->
  <rect x="50" y="50" width="700" height="400" fill="#FFFFFF" stroke="#333" stroke-width="2" rx="5"/>

  <!-- Window Header -->
  <rect x="50" y="50" width="700" height="40" fill="#6B46C1" rx="5"/>
  <circle cx="70" cy="70" r="6" fill="#FF5F56"/>
  <circle cx="90" cy="70" r="6" fill="#FFBD2E"/>
  <circle cx="110" cy="70" r="6" fill="#27C93F"/>
  <text x="400" y="77" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Claude Desktop</text>

  <!-- MCP Server Indicator -->
  <rect x="70" y="110" width="660" height="30" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1" rx="3"/>
  <circle cx="85" cy="125" r="5" fill="#4CAF50"/>
  <text x="100" y="130" font-size="12" fill="#2E7D32" font-weight="bold">MCP Server Connected: todo</text>
  <text x="550" y="130" font-size="11" fill="#666">6 tools available</text>

  <!-- Chat Interface -->
  <rect x="70" y="155" width="660" height="270" fill="#FAFAFA" stroke="#DDD" stroke-width="1" rx="3"/>

  <!-- User Message -->
  <rect x="90" y="175" width="500" height="50" fill="#E3F2FD" stroke="#2196F3" stroke-width="1" rx="5"/>
  <text x="100" y="195" font-size="12" fill="#1565C0" font-weight="bold">You</text>
  <text x="100" y="213" font-size="11" fill="#333">Create a high priority todo to implement authentication</text>

  <!-- Claude Response -->
  <rect x="210" y="240" width="500" height="165" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1" rx="5"/>
  <text x="220" y="260" font-size="12" fill="#6A1B9A" font-weight="bold">Claude</text>
  <text x="220" y="278" font-size="11" fill="#333">I'll create that todo for you.</text>

  <!-- Tool Use Indicator -->
  <rect x="230" y="290" width="460" height="20" fill="#FFF3E0" stroke="#FF9800" stroke-width="1" rx="3"/>
  <text x="240" y="304" font-size="10" fill="#E65100" font-family="monospace">🔧 Using tool: create_todo</text>

  <!-- Tool Result -->
  <rect x="230" y="320" width="460" height="70" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1" rx="3"/>
  <text x="240" y="335" font-size="10" fill="#2E7D32" font-weight="bold">✓ Todo created successfully</text>
  <text x="240" y="352" font-size="10" fill="#333" font-family="monospace">ID: 1</text>
  <text x="240" y="367" font-size="10" fill="#333" font-family="monospace">Title: Implement authentication</text>
  <text x="240" y="382" font-size="10" fill="#333" font-family="monospace">Priority: high | Status: pending</text>

  <!-- Available Tools Panel -->
  <rect x="70" y="440" width="200" height="15" fill="#E3F2FD" stroke="#2196F3" stroke-width="1" rx="2"/>
  <text x="75" y="451" font-size="9" fill="#1565C0">Tools: create • list • get • update • delete • search</text>

  <!-- Note -->
  <text x="400" y="480" font-size="11" text-anchor="middle" fill="#888" font-style="italic">Example: Claude Desktop with Todo MCP Server Integration</text>
</svg>
